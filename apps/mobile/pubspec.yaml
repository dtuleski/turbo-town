name: dashden_mobile
description: DashDen mobile app (iOS/Android) — Memory Match MVP.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # GraphQL client (mirrors the web app's Apollo setup)
  graphql_flutter: ^5.1.2

  # AWS Cognito auth (pure Dart, no native SDK required)
  amazon_cognito_identity_dart_2: ^3.6.3

  # Secure token storage (Keychain on iOS, Keystore on Android)
  flutter_secure_storage: ^9.2.2

  # Routing
  go_router: ^14.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
